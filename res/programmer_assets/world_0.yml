metadata:
  material_fp: materials.png

materials:
  - id: white
    scale: 16
    offset: [0, 0]
    size: [16, 16]
  - id: girder
    scale: 16
    offset: [16, 0]
    size: [16, 16]

geometry:
  - id: floor
    shape: parametric
    material: girder
    origin: [0, 0]
    data:
      x: 32*np.cos(np.pi*t)
      y: 32*np.sin(np.pi*t)
      parameter: [0, 2]
      scale: 16
      arc_sample: 1000
      cycle: True
